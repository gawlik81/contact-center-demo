<!-- Backdrop click is a mouse-only shortcut; keyboard users close via Esc (native cancel). -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog #dialogEl class="confirm-dialog" (cancel)="onNativeCancel($event)" (click)="onBackdropClick($event)">
  <div class="confirm-dialog__content">
    <p class="confirm-dialog__message">{{ message() }}</p>
    <div class="confirm-dialog__actions">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">{{ cancelLabel() }}</button>
      <button
        type="button"
        class="btn"
        [class.btn-danger]="danger()"
        [class.btn-primary]="!danger()"
        (click)="onConfirm()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</dialog>
