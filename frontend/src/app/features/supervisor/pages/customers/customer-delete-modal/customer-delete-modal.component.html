<dialog
  #dialogEl
  class="delete-dialog"
  aria-labelledby="gdpr-delete-title"
  aria-describedby="gdpr-delete-desc"
  (click)="$event.target === dialogEl ? onCancel() : null"
>
  <div class="delete-dialog__content" role="document">
    <div class="delete-dialog__header">
      <h2 id="gdpr-delete-title" class="delete-dialog__title">Usunięcie klienta (RODO)</h2>
    </div>

    <div class="delete-dialog__body">
      <p id="gdpr-delete-desc" class="delete-dialog__message">
        Dane klienta <strong>{{ customerName() }}</strong> zostaną
        <strong>zanonimizowane</strong> zgodnie z wymogami RODO. Imię i nazwisko zostaną
        zastąpione wartością <code>ANONYMIZED</code>, numery telefonów i adresy e-mail zostaną
        usunięte.
      </p>
      <p class="delete-dialog__warning" role="alert">
        Operacja jest <strong>nieodwracalna</strong>. Danych nie będzie można odzyskać.
      </p>
    </div>

    <div class="delete-dialog__footer">
      <button class="btn btn-cancel" type="button" (click)="onCancel()" autofocus>Anuluj</button>
      <button
        class="btn btn-delete"
        type="button"
        (click)="onConfirm()"
        [attr.aria-label]="'Anonimizuj dane klienta ' + customerName()"
      >
        Anonimizuj
      </button>
    </div>
  </div>
</dialog>
