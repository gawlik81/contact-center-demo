# docker-compose.local-demo.yml
# Nadpisania dla lokalnego demo z ngrok
# Uruchomienie: docker compose -f docker-compose.yml -f docker-compose.local-demo.yml up -d

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    image: cc-backend:local
    container_name: cc-backend
    env_file: .env.local-demo
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cc-network
    expose:
      - "8080"
    volumes:
      - backend_logs:/var/log/contact-center
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: cc-frontend:local
    container_name: cc-frontend
    restart: unless-stopped
    networks:
      - cc-network
    expose:
      - "80"
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:1.26-alpine
    container_name: cc-nginx
    ports:
      - "80:80"      # tylko HTTP — SSL obsługuje ngrok
    volumes:
      - ./nginx/nginx-local-demo.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - cc-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  postgres:
    ports: !reset [ ]
    expose:
      - "5432"
    environment:
      POSTGRES_DB: contact_center
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

  redis:
    ports: !reset [ ]
    expose:
      - "6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru

  rabbitmq:
    ports: !reset [ ]
    expose:
      - "5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /

  minio:
    ports: !reset [ ]
    expose:
      - "9000"

  clickhouse:
    ports: !reset [ ]
    expose:
      - "8123"
      - "9000"

volumes:
  nginx_logs:
  backend_logs:
