# =============================================================================
# docker-compose.yml – Lokalne środowisko DEV dla Contact Center SaaS
#
# Uruchomienie: docker compose up -d
# Zatrzymanie: docker compose down
# Reset bazy: docker compose down -v
#
# Serwisy:
#   - PostgreSQL 16  → localhost:5432
#   - Redis 7        → localhost:6379
#   - RabbitMQ 3.13  → localhost:5672 (AMQP), localhost:15672 (Management UI)
#   - MinIO          → localhost:9000 (S3 API), localhost:9001 (Console UI)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 – główna baza danych aplikacji
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cc-postgres
    environment:
      POSTGRES_DB: contact_center_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Timezone bazy danych – UTC (wymagane dla TIMESTAMPTZ)
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init skrypt – włączenie rozszerzeń (Flyway V001 robi to samo, ale lepiej wcześniej)
      - ./backend/src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contact_center_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - cc-network

  # ---------------------------------------------------------------------------
  # Redis 7 – cache, JWT blacklista, agent presence
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cc-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cc-network

  # ---------------------------------------------------------------------------
  # RabbitMQ 3.13 – broker wiadomości (ADR-03: RabbitMQ zamiast Kafka)
  # Management UI: http://localhost:15672 (guest/guest)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cc-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - cc-network

  # ---------------------------------------------------------------------------
  # MinIO – S3-compatible object storage (nagrania rozmów, pliki IVR)
  # API:     http://localhost:9000
  # Console: http://localhost:9001 (minioadmin/minioadmin)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: cc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - cc-network

  # ---------------------------------------------------------------------------
  # MinIO init – tworzy bucket contact-center-recordings po starcie MinIO
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: cc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/contact-center-recordings &&
        echo 'Bucket contact-center-recordings ready.'
      "
    networks:
      - cc-network

  # ---------------------------------------------------------------------------
  # Voicebot – mikrousługa Python ASR+NLU (BE-014)
  # Uruchamiana tylko z profilem ai: docker compose --profile ai up -d
  # Whisper model "base" (~140MB RAM) – nie blokuj normalnego docker compose up -d
  # ---------------------------------------------------------------------------
  voicebot:
    build:
      context: ./voicebot
      dockerfile: Dockerfile
    container_name: cc-voicebot
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      WHISPER_MODEL: small
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cc-network
    profiles:
      - ai

# =============================================================================
# Volumes – persystencja danych między restartami
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

# =============================================================================
# Sieci
# =============================================================================
networks:
  cc-network:
    driver: bridge
    name: contact-center-network
