# =============================================================================
# application-test.yml – Profil TEST (testy jednostkowe i integracyjne)
# Flyway wyłączony – testy używają H2 lub Testcontainers per klasa
# =============================================================================

spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  # Wyłączamy auto-konfigurację RabbitMQ i Redis (mockowane w testach)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

# JWT – klucze RSA dla testów (te same klucze co dev, generowane przez skrypt)
jwt:
  issuer: contact-center-test
  public-key-location: classpath:keys/public.pem
  private-key-location: classpath:keys/private.pem
  public-key-value: ""
  private-key-value: ""
  access-token-ttl-seconds: 900
  refresh-token-ttl-seconds: 604800

# Agent Breaks Activator – wyłączony w testach (scheduler nie powinien działać w tle)
agent:
  breaks:
    activator:
      enabled: false

logging:
  level:
    com.contactcenter: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
