# =============================================================================
# application-dev.yml – Profil DEV (lokalne środowisko)
# Contact Center SaaS – Spring Boot 3.3.x
#
# Przeznaczenie: lokalne środowisko deweloperskie
# Baza danych: lokalna instancja PostgreSQL (Docker Compose)
# Dane wrażliwe: wartości domyślne do lokalnego developmentu (nie prod!)
# =============================================================================

spring:

  # ---------------------------------------------------------------------------
  # Lifecycle – w dev skracamy timeout wyłączania (nie potrzebujemy 30s jak w prod)
  # ---------------------------------------------------------------------------
  lifecycle:
    timeout-per-shutdown-phase: 5s

  # ---------------------------------------------------------------------------
  # DataSource – lokalna baza PostgreSQL
  # Domyślnie: postgres://localhost:5432/contact_center_dev
  # Nadpisywalne przez zmienne ENV (przydatne w CI)
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contact_center_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    # HikariCP – connection pool
    hikari:
      pool-name: ContactCenter-HikariPool-Dev
      # Maksymalna liczba połączeń w puli
      maximum-pool-size: 10
      # Minimalna liczba połączeń w puli
      minimum-idle: 2
      # Timeout oczekiwania na połączenie z puli (ms)
      connection-timeout: 30000
      # Czas bezczynności przed zamknięciem połączenia (ms)
      idle-timeout: 600000
      # Maksymalny czas życia połączenia w puli (ms)
      max-lifetime: 1800000
      # Walidacja połączenia
      connection-test-query: SELECT 1
      # Rejestracja MBeans (monitoring JMX) – wyłączone, by uniknąć konfliktu przy DevTools restart
      register-mbeans: false
    # ClickHouse – dedykowany DataSource dla ETL DW (niezależny od głównego PG)
    # Port 8123 – HTTP interface ClickHouse (używany przez clickhouse-jdbc)
    clickhouse:
      url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/contact_center_dw}
      username: ${CLICKHOUSE_USERNAME:default}
      password: ${CLICKHOUSE_PASSWORD:}

  # ---------------------------------------------------------------------------
  # Flyway – migracje (profil DEV: włączone + seed danych testowych)
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    # W dev dodatkowo ładujemy seed z katalogu db/seed
    locations:
      - classpath:db/migration
      - classpath:db/seed
    # Umożliwia migracje out-of-order w dev (np. V039 po wcześniej zaaplikowanym V999 seed)
    out-of-order: true
    # Automatyczne czyszczenie wyłączone – nigdy nie edytuj pliku migracji,
    # który już został zastosowany. Zamiast tego twórz nowy plik V0xx__fix.sql.
    clean-on-validation-error: false
    clean-disabled: true
    # Placeholder dla seed: aktywny tylko w dev
    placeholders:
      seed_enabled: "true"

  # ---------------------------------------------------------------------------
  # JPA / Hibernate – tryb dev: show SQL, statystyki
  # ---------------------------------------------------------------------------
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
    # W dev możemy używać open-in-view (wygoda, nie w prod)
    open-in-view: false

  # ---------------------------------------------------------------------------
  # Redis – lokalny Redis
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      # Timeout połączenia (ms)
      connect-timeout: 2000
      # Timeout odczytu (ms)
      timeout: 2000
      lettuce:
        pool:
          # Maksymalna liczba połączeń w puli
          max-active: 8
          # Maksymalna liczba bezczynnych połączeń
          max-idle: 8
          # Minimalna liczba bezczynnych połączeń
          min-idle: 2
          # Timeout oczekiwania na połączenie z puli (ms)
          max-wait: 1000

  # ---------------------------------------------------------------------------
  # RabbitMQ – lokalna instancja
  # ---------------------------------------------------------------------------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # Potwierdzenia wydawcy (publisher confirms)
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # AUTO: Spring wysyła ACK po normalnym powrocie z listenera, NACK przy wyjątku → DLQ
        acknowledge-mode: auto
        # Ponowne próby przy błędzie
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

# =============================================================================
# Actuator – w dev szczegóły health widoczne bez autoryzacji
# =============================================================================
management:
  endpoint:
    health:
      show-details: always
      show-components: always

# =============================================================================
# Logowanie – tryb dev: DEBUG dla kodu aplikacji
# =============================================================================
logging:
  level:
    com.contactcenter: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.amqp: DEBUG
    io.lettuce.core: DEBUG

server:
  port: 8080

# =============================================================================
# Twilio Voice SDK – placeholders dla lokalnego developmentu
# W prawdziwym dev ustaw zmienne ENV: TWILIO_API_KEY_SID, TWILIO_API_KEY_SECRET, TWILIO_TWIML_APP_SID
# =============================================================================
twilio:
  api-key-sid: ${TWILIO_API_KEY_SID:SK_DEV_PLACEHOLDER}
  api-key-secret: ${TWILIO_API_KEY_SECRET:dev_secret_placeholder_32chars__}
  twiml-app-sid: ${TWILIO_TWIML_APP_SID:AP_DEV_PLACEHOLDER}
  # DEV ONLY: wyłącz weryfikację X-Twilio-Signature – Twilio nie może podpisać żądań
  # wysyłanych do lokalnego serwera (brak publicznego URL przy dev bez ngrok/tunelu).
  # W prod musi być true (domyślne w application.yml).
  signature-validation-enabled: false
  # Aby automatycznie skonfigurować StatusCallback URL dla wszystkich numerów Twilio
  # przypisanych do tenantów przy starcie aplikacji (Opcja C), ustaw:
  #   twilio.enabled: true
  # oraz zmienne ENV: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_STATUS_CALLBACK_URL
  # i opcjonalnie per-tenant: config.twilio_phone_number, config.twilio_status_callback_url

# =============================================================================
# Spring DevTools – wyłączamy auto-restart (powoduje "port already in use"
# gdy Tomcat nie zdąży zwolnić portu przed ponownym startem kontekstu).
# additional-exclude: wyklucza pliki logów z obserwacji zmian (bez wpływu na restart).
# =============================================================================
spring.devtools:
  restart:
    enabled: false
    additional-exclude: "logs/**,*.log"

# =============================================================================
# ETL – Data Warehouse (BE-030b)
# Typ DW: clickhouse | postgres
# Gdy clickhouse: EtlSyncService zapisuje do ClickHouse przez ClickHouseDwWriter.
# Gdy postgres (lub brak property): fallback do PostgresDwWriter (tabela contacts_dw w PG).
#
# DEV DEFAULT: postgres – ClickHouse nie jest uruchamiane przez docker-compose
# w standardowym środowisku dev. Aby przetestować ETL z ClickHouse lokalnie:
#   1. Uruchom: docker compose --profile dw up -d  (lub ręcznie kontener ClickHouse na :8123)
#   2. Ustaw zmienną ENV: ETL_DW_TYPE=clickhouse  albo zmień poniżej na "clickhouse"
# =============================================================================
etl:
  dw:
    type: ${ETL_DW_TYPE:postgres}
  sync:
    # Interwał ETL w ms – 60s domyślnie (nadpisywalne przez ENV)
    fixed-delay-ms: ${ETL_SYNC_DELAY_MS:60000}