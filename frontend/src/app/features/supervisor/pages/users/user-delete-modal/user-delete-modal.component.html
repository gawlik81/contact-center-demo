<dialog
  #dialogEl
  class="delete-dialog"
  aria-labelledby="delete-title"
  aria-describedby="delete-desc"
  (click)="$event.target === dialogEl ? onCancel() : null"
>
  <div class="delete-dialog__content" role="document">
    <div class="delete-dialog__header">
      <h2 id="delete-title" class="delete-dialog__title">Usun agenta</h2>
    </div>

    <div class="delete-dialog__body">
      <p id="delete-desc" class="delete-dialog__message">
        Czy na pewno chcesz usunac agenta
        <strong>{{ user().firstName }} {{ user().lastName }}</strong
        >? Ta operacja jest nieodwracalna.
      </p>
      <p class="delete-dialog__warning">Jezeli agent ma aktywne kontakty, operacja zostanie odrzucona.</p>
    </div>

    <div class="delete-dialog__footer">
      <button class="btn btn-cancel" type="button" (click)="onCancel()" autofocus>Anuluj</button>
      <button
        class="btn btn-delete"
        type="button"
        (click)="onConfirm()"
        [attr.aria-label]="'Potwierdz usuniecie agenta ' + user().firstName + ' ' + user().lastName"
      >
        Usun
      </button>
    </div>
  </div>
</dialog>
