<!-- The live region exists permanently (a region inserted together with its text is often not
     announced). Its text changes once per ACW tab, so route/tab switches never repeat it. -->
<div class="sr-only" role="status">{{ announcement() }}</div>

@if (pendingTab()) {
  <section class="acw-banner" data-testid="acw-banner" [attr.aria-label]="'agent.acwBanner.title' | transloco">
    <svg class="acw-banner__icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
      <path
        d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"
      />
    </svg>
    <div class="acw-banner__text">
      <span class="acw-banner__title">{{ 'agent.acwBanner.title' | transloco }}</span>
      <span class="acw-banner__who"
        >{{ who() }}
        @if (moreCount() > 0) {
          <span class="acw-banner__more">{{ 'agent.acwBanner.more' | transloco: { count: moreCount() } }}</span>
        }
      </span>
    </div>
    <button type="button" class="acw-banner__action" (click)="complete()">
      {{ 'agent.acwBanner.action' | transloco }}
    </button>
  </section>
}
