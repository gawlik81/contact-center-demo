<dialog
  #dialogEl
  class="delete-dialog"
  aria-labelledby="queue-delete-title"
  aria-describedby="queue-delete-desc"
  (click)="$event.target === $event.currentTarget ? onCancel() : null"
>
  <div class="delete-dialog__content" role="document">
    <div class="delete-dialog__header">
      <h2 id="queue-delete-title" class="delete-dialog__title">Usuniecie kolejki</h2>
    </div>

    <div class="delete-dialog__body">
      <p id="queue-delete-desc" class="delete-dialog__message">
        Czy na pewno chcesz usunac kolejke <strong>{{ queueName() }}</strong>?
      </p>
      <p class="delete-dialog__warning" role="alert">
        Operacja jest <strong>nieodwracalna</strong>. Kolejki z aktywnymi kontaktami nie mozna usunac.
      </p>
    </div>

    <div class="delete-dialog__footer">
      <button class="btn btn-cancel" type="button" (click)="onCancel()" autofocus>Anuluj</button>
      <button
        class="btn btn-delete"
        type="button"
        (click)="onConfirm()"
        [attr.aria-label]="'Usun kolejke ' + queueName()"
      >
        Usun
      </button>
    </div>
  </div>
</dialog>
