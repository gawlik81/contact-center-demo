<dialog
  #dialogEl
  class="delete-dialog"
  aria-labelledby="queue-delete-title"
  aria-describedby="queue-delete-desc"
  (click)="$event.target === $event.currentTarget ? onCancel() : null"
>
  <div class="delete-dialog__content" role="document">
    <div class="delete-dialog__header">
      <h2 id="queue-delete-title" class="delete-dialog__title">{{ 'supervisor.queueDelete.title' | transloco }}</h2>
    </div>

    <div class="delete-dialog__body">
      <p id="queue-delete-desc" class="delete-dialog__message">
        {{ 'supervisor.queueDelete.body' | transloco }} <strong>{{ queueName() }}</strong
        >?
      </p>
      <p class="delete-dialog__warning" role="alert">
        {{ 'supervisor.queueDelete.warning' | transloco }}
      </p>
    </div>

    <div class="delete-dialog__footer">
      <button class="btn btn-cancel" type="button" (click)="onCancel()" autofocus>
        {{ 'common.cancel' | transloco }}
      </button>
      <button
        class="btn btn-delete"
        type="button"
        (click)="onConfirm()"
        [attr.aria-label]="('common.delete' | transloco) + ' ' + queueName()"
      >
        {{ 'common.delete' | transloco }}
      </button>
    </div>
  </div>
</dialog>
