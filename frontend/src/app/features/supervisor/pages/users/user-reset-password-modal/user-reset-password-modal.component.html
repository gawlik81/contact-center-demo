<dialog
  #dialogEl
  class="reset-dialog"
  aria-labelledby="reset-title"
  aria-describedby="reset-desc"
  (click)="$event.target === dialogEl ? onCancel() : null"
>
  <div class="reset-dialog__content" role="document">
    <div class="reset-dialog__header">
      <h2 id="reset-title" class="reset-dialog__title">Wymus reset hasla</h2>
    </div>

    <div class="reset-dialog__body">
      <p id="reset-desc" class="reset-dialog__message">
        Czy na pewno chcesz wymusic reset hasla dla agenta
        <strong>{{ user().firstName }} {{ user().lastName }}</strong
        >?
      </p>
      <p class="reset-dialog__info">
        Agent bedzie musial zmienic haslo przy nastepnym logowaniu. Jego obecna sesja zostanie utrzymana do czasu
        wylogowania.
      </p>
    </div>

    <div class="reset-dialog__footer">
      <button class="btn btn-cancel" type="button" (click)="onCancel()" autofocus>Anuluj</button>
      <button
        class="btn btn-confirm"
        type="button"
        (click)="onConfirm()"
        [attr.aria-label]="'Potwierdz reset hasla dla agenta ' + user().firstName + ' ' + user().lastName"
      >
        Wymus reset
      </button>
    </div>
  </div>
</dialog>
