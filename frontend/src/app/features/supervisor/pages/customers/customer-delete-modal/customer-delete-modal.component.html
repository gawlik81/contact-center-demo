<dialog
  #dialogEl
  class="delete-dialog"
  aria-labelledby="gdpr-delete-title"
  aria-describedby="gdpr-delete-desc"
  (click)="$event.target === dialogEl ? onCancel() : null"
>
  <div class="delete-dialog__content" role="document">
    <div class="delete-dialog__header">
      <h2 id="gdpr-delete-title" class="delete-dialog__title">{{ 'supervisor.customerDelete.title' | transloco }}</h2>
    </div>

    <div class="delete-dialog__body">
      <p id="gdpr-delete-desc" class="delete-dialog__message">
        {{ 'supervisor.customerDelete.message1' | transloco }}
        <strong>{{ customerName() }}</strong>
        {{ 'supervisor.customerDelete.message2' | transloco }}
      </p>
      <p class="delete-dialog__warning" role="alert">
        {{ 'supervisor.customerDelete.warning' | transloco }}
      </p>
    </div>

    <div class="delete-dialog__footer">
      <button class="btn btn-cancel" type="button" (click)="onCancel()" autofocus>{{ 'common.cancel' | transloco }}</button>
      <button
        class="btn btn-delete"
        type="button"
        (click)="onConfirm()"
        [attr.aria-label]="('supervisor.customerDelete.confirmLabel' | transloco) + ' ' + customerName()"
      >
        {{ 'supervisor.customerDelete.confirm' | transloco }}
      </button>
    </div>
  </div>
</dialog>
