<div class="audio-player" role="region" aria-label="Odtwarzacz nagrania">
  <audio #audioEl [src]="src()" preload="metadata" aria-hidden="true"></audio>

  @if (loadError()) {
    <div class="audio-player__error" role="alert">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
      </svg>
      <span>Nie udalo sie zaladowac nagrania</span>
    </div>
  } @else {
    <div class="audio-player__controls">
      <!-- Play / Pause button -->
      <button
        class="audio-player__play-btn"
        type="button"
        [attr.aria-label]="isPlaying() ? 'Wstrzymaj' : 'Odtwarzaj'"
        [attr.aria-pressed]="isPlaying()"
        (click)="togglePlay()"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          <svg class="audio-player__spinner" viewBox="0 0 24 24" fill="none" width="20" height="20" aria-hidden="true">
            <circle
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="3"
              stroke-dasharray="31.4"
              stroke-dashoffset="10"
            />
          </svg>
        } @else if (isPlaying()) {
          <!-- Pause icon -->
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        } @else {
          <!-- Play icon -->
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        }
      </button>

      <!-- Progress bar + time -->
      <div class="audio-player__progress-area">
        <div class="audio-player__time audio-player__time--current" aria-live="off">
          {{ currentTimeFormatted() }}
        </div>

        <div class="audio-player__track" role="presentation">
          <div class="audio-player__track-fill" [style.width.%]="progressPercent()"></div>
          <input
            class="audio-player__range"
            type="range"
            [min]="0"
            [max]="duration() > 0 ? duration() : (durationSeconds() ?? 100)"
            [value]="currentTime()"
            step="0.5"
            aria-label="Pozycja odtwarzania"
            [attr.aria-valuetext]="currentTimeFormatted() + ' z ' + durationFormatted()"
            (input)="onSeek($event)"
          />
        </div>

        <div class="audio-player__time audio-player__time--total">
          {{ durationFormatted() }}
        </div>
      </div>

      <!-- Download button -->
      <a
        class="audio-player__download-btn"
        [href]="src()"
        download
        aria-label="Pobierz nagranie"
        title="Pobierz nagranie"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5v-2z" />
        </svg>
      </a>
    </div>
  }
</div>
