<dialog
  #dialogEl
  class="delete-dialog"
  aria-labelledby="delete-title"
  aria-describedby="delete-desc"
  (click)="$event.target === dialogEl ? onCancel() : null"
>
  <div class="delete-dialog__content" role="document">
    <div class="delete-dialog__header">
      <h2 id="delete-title" class="delete-dialog__title">{{ 'supervisor.userDelete.title' | transloco }}</h2>
    </div>

    <div class="delete-dialog__body">
      <p id="delete-desc" class="delete-dialog__message">
        {{ 'supervisor.userDelete.body' | transloco }}
        <strong>{{ user().firstName }} {{ user().lastName }}</strong>?
        {{ 'supervisor.userDelete.irreversible' | transloco }}
      </p>
      <p class="delete-dialog__warning">{{ 'supervisor.userDelete.warning' | transloco }}</p>
    </div>

    <div class="delete-dialog__footer">
      <button class="btn btn-cancel" type="button" (click)="onCancel()" autofocus>
        {{ 'common.cancel' | transloco }}
      </button>
      <button
        class="btn btn-delete"
        type="button"
        (click)="onConfirm()"
        [attr.aria-label]="('supervisor.userDelete.confirmLabel' | transloco) + ' ' + user().firstName + ' ' + user().lastName"
      >
        {{ 'common.delete' | transloco }}
      </button>
    </div>
  </div>
</dialog>
