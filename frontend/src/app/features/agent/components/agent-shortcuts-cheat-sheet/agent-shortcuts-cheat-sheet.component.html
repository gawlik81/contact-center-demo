@if (hotkeys.cheatSheetOpen()) {
  <section
    #panel
    id="cheat-sheet-panel"
    data-cc-cheat-sheet
    class="cheat-sheet"
    [style.top.px]="position()?.top"
    [style.left.px]="position()?.left"
    [style.right]="position() ? 'auto' : null"
    role="dialog"
    aria-modal="false"
    aria-labelledby="cheat-sheet-title"
    tabindex="-1"
  >
    <header class="cheat-sheet__header">
      <h2 id="cheat-sheet-title" class="cheat-sheet__title">{{ 'agent.shortcuts.title' | transloco }}</h2>
      <button
        type="button"
        class="cheat-sheet__close"
        [attr.aria-label]="'agent.shortcuts.close' | transloco"
        [title]="'agent.shortcuts.close' | transloco"
        (click)="hotkeys.closeCheatSheet()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
          />
        </svg>
      </button>
    </header>

    <dl class="cheat-sheet__list">
      @for (row of rows; track row.labelKey) {
        <div class="cheat-sheet__row">
          <dt class="cheat-sheet__keys">
            @for (key of row.keys; track $index) {
              <kbd class="cheat-sheet__key">{{ key }}</kbd>
            }
          </dt>
          <dd class="cheat-sheet__label">{{ row.labelKey | transloco }}</dd>
        </div>
      }
    </dl>
  </section>
}
