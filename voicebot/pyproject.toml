[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "voicebot"
version = "1.0.0"
description = "Voicebot microservice – ASR + NLU for Contact Center SaaS (BE-014)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pytest]
# pytest-asyncio wymagany dla testów async
# pip install pytest-asyncio
